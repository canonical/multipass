name: Verify Commits

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

jobs:
  CheckCommits:
    runs-on: ubuntu-slim

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify commit messages
        run: |
          set -e -o pipefail

          # Get the base and head commits for the PR
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"

          COUNTER=1
          echo "0" > fail.txt  # use a file to track failure status, as the while loop below runs in
                               # a subshell and can't update variables outside

          # loop over all commits in the PR (excluding merge base)
          git rev-list --reverse $BASE_SHA..$HEAD_SHA | while read -r COMMIT_SHA; do
            echo "-- Verifying commit $COUNTER: $COMMIT_SHA --"

            if git rev-parse -q --verify "${COMMIT_SHA}^2" >/dev/null; then
              echo "⏩ Skipping merge commit"
            else
              MSG="$(git log -n1 --format=%B $COMMIT_SHA | head -c -1)"
              echo "$MSG"

              if ! ./git-hooks/commit-msg.py --strict - <<< "$MSG"; then
                echo "❌"
                echo "1" > fail.txt
              else
                echo "✅"
              fi
            fi
            COUNTER=$((COUNTER + 1))
          done

          echo -e "\n-- Finished verifying commits --\n"

          FAIL=$(cat fail.txt)
          rm fail.txt

          if [ $FAIL -eq 1 ]; then
            echo "One or more commits failed validation"
            exit 1
          else
            echo "All commits passed validation"
          fi

      - name: Verify commit signatures
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -e -o pipefail

          FAIL=0
          COMMITS="$(git rev-list --reverse "$BASE_SHA..$HEAD_SHA")"

          # loop over all commits in the PR (excluding merge base), merge commits included
          for COMMIT_SHA in $COMMITS; do
            REASON="$(gh api "repos/$REPO/commits/$COMMIT_SHA" \
                        --jq '.commit.verification | if .verified then "" else .reason end')"

            if [ -z "$REASON" ]; then
              # The API does not distinguish "Partially verified" commits, which have an author
              # other than the committer with vigilant mode enabled. Warn about possible ones.
              COMMITTER="$(git log -1 --format=%ce "$COMMIT_SHA")"
              OTHER_AUTHORS="$(
                {
                  # GitHub signs commits it creates on behalf of their author (e.g. via web UI)
                  [ "$COMMITTER" = "noreply@github.com" ] || git log -1 --format=%ae "$COMMIT_SHA"
                  git log -1 --format='%(trailers:key=Co-authored-by,valueonly)' "$COMMIT_SHA" \
                    | sed -n 's/.*<\(.*\)>.*/\1/p'
                } | grep -Fivx -e "$COMMITTER" -e "" | sort -fu | paste -sd ' ' || true
              )"

              if [ -z "$OTHER_AUTHORS" ]; then
                echo "✅ $COMMIT_SHA"
              else
                echo "⚠️ $COMMIT_SHA (possibly partially verified)"
                echo "::warning title=Possibly partially verified commit::Commit $COMMIT_SHA is" \
                     "signed by $COMMITTER but also authored by: $OTHER_AUTHORS. If any of them has" \
                     "vigilant mode enabled, GitHub shows it as \"Partially verified\". This is" \
                     "accepted, but the signature does not attest their consent."
              fi
            else
              echo "❌ $COMMIT_SHA ($REASON)"
              FAIL=1
            fi
          done

          if [ $FAIL -eq 1 ]; then
            echo "One or more commits are not signed and verified. All commits must be signed and show"
            echo "as \"Verified\" (or \"Partially verified\") on GitHub. See GIT7 in our guidelines:"
            echo "https://github.com/canonical/multipass/blob/main/GUIDELINES.md#git-usage-git"
            exit 1
          else
            echo "All commits are signed and verified"
          fi
