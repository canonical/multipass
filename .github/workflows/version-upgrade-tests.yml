name: Version Upgrade Tests

# Validates that VMs and their state created on one Multipass version survive an
# upgrade to another. The two pytest phases MUST run on the same runner in one
# job: the seeded VMs live in the daemon's on-disk storage (/var/snap/multipass
# on Linux), which does not travel between jobs. The package swap happens
# between the two phases, here, in CI -- the test code never installs anything.
#
# In CI this is dispatched by the Linux build (see linux.yml) once the branch's
# snap has been published to its channel: it upgrades the *latest released*
# Multipass (`stable`) to the snap *built by the branch* (`to-snap-channel`).
# Both ends are plain snap channels, so the upgrade is a `snap refresh` that
# keeps the common data dir in place.
#
# The suite is sharded across runners like the cli-tests: pytest-split divides
# the seed phase, and each shard's verify phase checks only the scenarios its
# seed run selected (recorded in the manifest), so a scenario's seed and verify
# always share a runner.

on:
  workflow_call:
    inputs: &inputs
      from-snap-channel:
        type: string
        description: "Snap channel to install Multipass from (the 'before' version, X). Defaults to the latest release (`stable`)."
        required: false
        default: "stable"
      to-snap-channel:
        type: string
        description: "Snap channel to refresh Multipass to (the 'after' version, Y -- e.g. the branch's published channel)"
        required: true
      backend-driver:
        type: string
        description: "Backend driver to use (e.g. qemu)"
        required: false
        default: "auto"
      pytest-extra-args:
        type: string
        description: "Extra arguments appended to both pytest invocations"
        required: false
        default: ""
  workflow_dispatch:
    inputs: *inputs

permissions:
  contents: read
  actions: read
  checks: write

env:
  FROM_SNAP_CHANNEL: ${{ inputs['from-snap-channel'] }}
  TO_SNAP_CHANNEL: ${{ inputs['to-snap-channel'] }}
  BACKEND_DRIVER: ${{ inputs['backend-driver'] }}
  PYTEST_EXTRA_ARGS: ${{ inputs['pytest-extra-args'] }}
  MANIFEST: reports/upgrade-manifest.json
  SPLITS: 4
  # Also spelled out in the test-durations.yml calls, where `env` is unavailable.
  DURATIONS_KEY: upgrade-durations-ubuntu-latest-snap-${{ inputs['backend-driver'] }}

jobs:
  PrepareDurations:
    uses: ./.github/workflows/test-durations.yml
    with:
      mode: restore
      durations-key: upgrade-durations-ubuntu-latest-snap-${{ inputs['backend-driver'] }}

  upgrade-tests:
    name: Upgrade ${{ inputs['from-snap-channel'] }} -> ${{ inputs['to-snap-channel'] }} (Snap) [${{ matrix.shard }}/4]
    needs: PrepareDurations
    runs-on: ubuntu-latest
    concurrency:
      group: upgrade-tests-${{ github.workflow }}-${{ github.head_ref || github.run_id }}-${{ matrix.shard }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        # Keep in sync with env.SPLITS (env is not available here).
        shard: [1, 2, 3, 4]
    env:
      SHARD: ${{ matrix.shard }}
    steps:
      - name: Check out cli-tests
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: false
          sparse-checkout: |
            tests/cli
            tests/upgrade

      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'

      - name: Create and activate virtual environment
        run: |
          python3 -m venv .venv
          echo "PATH=${GITHUB_WORKSPACE}/.venv/bin:$PATH" >> "$GITHUB_ENV"

      - name: Install cli-tests dependencies
        run: pip install -e ./tests/cli/

      ##################################################################
      # Phase 1: install the 'from' version and seed the VMs.
      # NB: --remove-all-instances is deliberately NOT passed -- it would
      #     wipe the very VMs the verify phase relies on.
      ##################################################################
      - name: Install Multipass (from / version X)
        run: sudo snap install multipass --channel="${FROM_SNAP_CHANNEL}"

      - name: Record installed 'from' version
        shell: bash
        run: |
          # multipassd writes its root cert during init; a client invoked before
          # that aborts with a missing-cert error. Poll `version` (present in every
          # release, unlike wait-ready) until the daemon answers.
          for _ in $(seq 1 60); do
            multipass version && exit 0
            sleep 2
          done
          echo "Multipass daemon did not become ready in time" >&2
          exit 1

      - name: Download shared timing baseline
        uses: actions/download-artifact@v8
        with:
          name: baseline-${{ env.DURATIONS_KEY }}

      - name: Seed VMs (phase 1)
        id: seed
        shell: bash
        run: |
          pytest -s tests/upgrade \
            -m seed \
            --upgrade-manifest="${MANIFEST}" \
            --daemon-controller=snap \
            --driver="${BACKEND_DRIVER}" \
            --print-all-output \
            --junitxml=reports/junit-seed.xml \
            --splits="${SPLITS}" \
            --group="${SHARD}" \
            --splitting-algorithm=least_duration \
            --durations-path=test-durations.json \
            --store-durations \
            --clean-durations \
            ${PYTEST_EXTRA_ARGS} || SEED_EXIT=$?
          # least_duration assigns the first selected test to shard 1, so only
          # other shards may legitimately be left with nothing to seed.
          if [[ ${SEED_EXIT:-0} == 5 && ${SHARD} != 1 ]]; then
            echo "empty=true" >> "$GITHUB_OUTPUT"
          elif [[ ${SEED_EXIT:-0} != 0 ]]; then
            echo "seed-exit=${SEED_EXIT}" >> "$GITHUB_OUTPUT"
          fi

      ##################################################################
      # The upgrade itself. `snap refresh` keeps the common data dir in
      # place, so seeded instances persist across the binary swap.
      ##################################################################
      - name: Upgrade Multipass (to / version Y)
        # only upgrade if seeding passed
        if: steps.seed.outputs.seed-exit == '' && steps.seed.outputs.empty != 'true'
        shell: bash
        run: |
          sudo snap refresh multipass --channel="${TO_SNAP_CHANNEL}"
          # As with the install above, wait for the refreshed daemon to finish
          # initializing (and rewrite its root cert) before the first client call.
          for _ in $(seq 1 60); do
            multipass version && exit 0
            sleep 2
          done
          echo "Multipass daemon did not become ready after upgrade" >&2
          exit 1

      ##################################################################
      # Phase 2: validate the seeded VMs on the 'to' version. Not split:
      # the manifest restricts it to the scenarios this shard seeded.
      ##################################################################
      - name: Verify VMs after upgrade (phase 2)
        id: verify
        if: steps.seed.outputs.seed-exit == '' && steps.seed.outputs.empty != 'true'
        shell: bash
        run: |
          pytest -s tests/upgrade \
            -m verify \
            --upgrade-manifest="${MANIFEST}" \
            --daemon-controller=snap \
            --driver="${BACKEND_DRIVER}" \
            --print-all-output \
            --junitxml=reports/junit-verify.xml \
            ${PYTEST_EXTRA_ARGS} || echo "verify-exit=$?" >> "$GITHUB_OUTPUT"

      - name: Upload upgrade manifest
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: upgrade-manifest-${{ matrix.shard }}
          path: ${{ env.MANIFEST }}
          if-no-files-found: warn

      - name: Report seed results
        if: (success() || failure()) && steps.seed.outputs.empty != 'true'
        uses: dorny/test-reporter@v3
        with:
          name: Upgrade seed results (X=${{ inputs['from-snap-channel'] }}) [${{ matrix.shard }}/4]
          path: reports/junit-seed.xml
          reporter: java-junit
          fail-on-error: false

      - name: Report verify results
        if: (success() || failure()) && steps.seed.outputs.empty != 'true'
        uses: dorny/test-reporter@v3
        with:
          name: Upgrade verify results (Y=${{ inputs['to-snap-channel'] }}) [${{ matrix.shard }}/4]
          path: reports/junit-verify.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload test durations
        if: ${{ github.ref == 'refs/heads/main' && inputs.pytest-extra-args == '' && steps.seed.outputs.seed-exit == '' }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.DURATIONS_KEY }}-${{ matrix.shard }}
          path: test-durations.json
          if-no-files-found: error
          overwrite: true

  SaveDurations:
    name: Save upgrade test durations
    needs: upgrade-tests
    if: ${{ github.ref == 'refs/heads/main' && inputs.pytest-extra-args == '' }}
    runs-on: ubuntu-latest
    steps:
      - name: Download test durations
        uses: actions/download-artifact@v8
        with:
          pattern: ${{ env.DURATIONS_KEY }}-*
          path: shards

      # Each shard stores only the seed tests it ran, so their union is the full
      # table. A shard whose seed run failed uploads nothing, which fails this.
      - name: Merge test durations
        run: |
          jq -es --argjson expected "${SPLITS}" \
            'if length == $expected then add else error("missing shard timings") end' \
            shards/*/test-durations.json > test-durations.json

      - name: Save test durations
        uses: actions/cache/save@v6
        with:
          path: test-durations.json
          key: ${{ env.DURATIONS_KEY }}-${{ github.run_id }}-${{ github.run_attempt }}
