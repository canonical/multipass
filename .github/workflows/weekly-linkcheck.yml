name: Weekly documentation link check

on:
  schedule:
    - cron: '0 12 * * 4' # Every Thursday at noon UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linkcheck:
    name: Check documentation links
    uses: canonical/documentation-workflows/.github/workflows/link-check.yaml@main
    with:
      working-directory: './docs'
      fetch-depth: 0
      python-version: '3.12'
