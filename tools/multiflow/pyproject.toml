[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multiflow"
version = "0.1.0"
description = "Composable, harness-agnostic multi-role agent workflows (Copilot CLI, Claude Code, OpenCode)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "mcp>=1.2.0",
]

[project.optional-dependencies]
test = ["pytest>=7.0"]

[project.scripts]
multiflow = "multiflow.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["multiflow*"]

[tool.setuptools.package-data]
multiflow = ["library/roles/*.md", "library/recipes/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
